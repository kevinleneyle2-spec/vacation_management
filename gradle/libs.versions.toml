junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.4.21"
composeBom = "2026.09.00"
navigation = "2.10.2"
hiltNavigation = "1.4.0"
ksp = "2.3.6"
room = "2.8.5"
appcompat = "1.8.0"
material = "1.14.0"
kotlinStdlib = "2.4.21"
kotlinTest = "2.3.10"
runner = "1.7.0"
core = "1.7.0"
kotlinCoroutinesTest = "1.11.0"
kotlinxSerializationJson = "1.12.0"
mockito = "5.24.0"
mockitoKotlin = "6.4.0"
uiTooling = "1.12.1"
